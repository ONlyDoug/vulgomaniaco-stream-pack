<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Design Tokens IVEXI</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background-color: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body, system-ui, sans-serif);
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .surface {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    h1, h2, h3 {
      font-family: var(--font-heading, inherit);
      margin-top: 0;
    }
    .text-muted {
      color: var(--color-text-muted);
    }
    .accent-text {
      color: var(--color-accent);
      font-weight: bold;
    }
    button {
      background-color: var(--color-focus);
      color: #FAFAFA;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    button:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1px));
      gap: 10px;
      margin-top: 10px;
    }
    .color-swatch {
      width: 100px;
      height: 100px;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      font-size: 0.75rem;
      font-family: var(--font-mono, monospace);
      border: 1px solid var(--color-border);
    }
    .controls {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <button onclick="document.documentElement.classList.toggle('dark')">Alternar Light/Dark Mode</button>
    </div>

    <div class="surface">
      <h1>IVEXI - Guilda Albion Online</h1>
      <p class="text-muted">Alegria, Caos e Violência no PVP.</p>
      
      <p>Este é um texto normal na superfície. <span class="accent-text">Este é um texto de acento.</span></p>
      
      <button>Botão de Ação (Focus)</button>
    </div>

    <h2>Paleta Semântica</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <div class="color-swatch" style="background-color: var(--color-background); color: var(--color-text);">Background</div>
      <div class="color-swatch" style="background-color: var(--color-surface); color: var(--color-text);">Surface</div>
      <div class="color-swatch" style="background-color: var(--color-text); color: var(--color-background);">Text</div>
      <div class="color-swatch" style="background-color: var(--color-text-muted); color: var(--color-background);">Muted</div>
      <div class="color-swatch" style="background-color: var(--color-accent); color: var(--color-background);">Accent</div>
      <div class="color-swatch" style="background-color: var(--color-focus); color: #FFF;">Focus</div>
    </div>
  </div>
</body>
</html>
