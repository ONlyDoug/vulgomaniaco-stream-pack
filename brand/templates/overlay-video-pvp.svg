<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#160A24" stop-opacity="0.97" />
      <stop offset="50%" stop-color="#12061E" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0A0314" stop-opacity="0.99" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0D33" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#120720" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="ctaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240E3C" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#150824" stop-opacity="0.99" />
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C378FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#732EB8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonPurpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; font-weight: 700; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>

